<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Simulador de Créditos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== PANTALLA: CARGA ===== -->
  <div id="screen-loading" class="screen active">
    <div class="loading-center">
      <div class="spinner"></div>
      <p class="loading-text">Cargando programas...</p>
    </div>
  </div>

  <!-- ===== PANTALLA: INICIO ===== -->
  <div id="screen-home" class="screen">
    <header class="app-header">
      <div class="header-logo" id="header-logo-home"></div>
      <h1 class="header-title" id="header-title-home">Simulador de Créditos</h1>
    </header>

    <div class="screen-body">
      <!-- Correo del usuario -->
      <div class="user-email-bar">
        <span class="email-icon">✉</span>
        <input type="email" id="input-user-email" placeholder="Tu correo electrónico" autocomplete="email" />
        <button class="btn-icon" id="btn-save-email" title="Guardar correo">✓</button>
      </div>

      <p class="section-label">Selecciona un programa</p>
      <div id="programs-grid" class="programs-grid">
        <!-- Se generan dinámicamente -->
      </div>

      <div class="home-actions">
        <button class="btn-secondary full-width" id="btn-go-history">
          📋 Ver historial de simulaciones
        </button>
      </div>
    </div>
  </div>

  <!-- ===== PANTALLA: SIMULADOR ===== -->
  <div id="screen-simulator" class="screen">
    <header class="app-header">
      <button class="btn-back" id="btn-back-sim">← Regresar</button>
      <div class="header-logo" id="header-logo-sim"></div>
      <h2 class="header-title" id="sim-program-name">Simulador</h2>
    </header>

    <div class="screen-body">

      <!-- BLOQUE: Datos del solicitante -->
      <div class="card">
        <h3 class="card-title">Datos del Solicitante</h3>

        <div class="field-group">
          <label class="field-label">Nombre del Solicitante *</label>
          <input type="text" id="input-nombre" class="field-input" placeholder="Nombre completo" />
        </div>

        <div class="field-group">
          <label class="field-label">Fecha de inicio *</label>
          <input type="date" id="input-fecha" class="field-input" />
        </div>
      </div>

      <!-- BLOQUE: Parámetros financieros (solo lectura para usuario) -->
      <div class="card" id="card-params">
        <h3 class="card-title">Parámetros del Programa</h3>
        <div class="params-grid" id="params-display">
          <!-- Se generan dinámicamente -->
        </div>
      </div>

      <!-- BLOQUE: Sub-tipo de fondo (solo motor_standard) -->
      <div class="card" id="card-fondo" style="display:none">
        <h3 class="card-title">Tipo de Fondo</h3>
        <div class="radio-group">
          <label class="radio-option" id="radio-caja-chica">
            <input type="radio" name="fondo" value="caja_chica" />
            <span class="radio-label">
              <strong>Caja Chica</strong>
              <small id="label-caja-chica-pct"></small>
            </span>
          </label>
          <label class="radio-option" id="radio-sutiexpress">
            <input type="radio" name="fondo" value="sutiexpress" />
            <span class="radio-label">
              <strong>SutiExpress</strong>
              <small id="label-sutiexpress-pct"></small>
            </span>
          </label>
        </div>
      </div>

      <!-- BLOQUE: Configuración del crédito -->
      <div class="card">
        <h3 class="card-title">Configuración del Crédito</h3>

        <!-- Precio de contado (motor_standard y motor_autos con precio) -->
        <div class="field-group" id="group-precio-contado">
          <label class="field-label">Precio de Contado</label>
          <div class="field-readonly" id="display-precio-contado">—</div>
        </div>

        <!-- Enganche -->
        <div class="field-group" id="group-enganche">
          <label class="field-label" id="label-enganche">Enganche</label>
          <div class="input-money">
            <span class="currency-sign">$</span>
            <input type="number" id="input-enganche" class="field-input money" placeholder="0.00" min="0" step="0.01" />
          </div>
          <p class="field-hint" id="hint-enganche"></p>
        </div>

        <!-- Precio de Financiamiento (motor_autos cuando admin lo define) -->
        <div class="field-group" id="group-precio-financiamiento" style="display:none">
          <label class="field-label">Precio de Financiamiento</label>
          <div class="field-readonly" id="display-precio-financiamiento">—</div>
        </div>

        <!-- Plazo -->
        <div class="field-group" id="group-plazo">
          <label class="field-label" id="label-plazo">Plazo</label>
          <div class="plazo-input-row">
            <input type="number" id="input-plazo" class="field-input plazo-num" min="1" placeholder="24" />
            <span class="plazo-unit" id="plazo-unit-label">quincenas</span>
          </div>
          <p class="field-hint" id="hint-plazo"></p>
        </div>
      </div>

      <!-- BLOQUE: Resumen financiero (tiempo real) -->
      <div class="card card-resumen" id="card-resumen" style="display:none">
        <h3 class="card-title">Resumen Financiero</h3>
        <div class="resumen-grid" id="resumen-display">
          <!-- Se generan dinámicamente -->
        </div>
      </div>

      <!-- BLOQUE: Tabla de amortización -->
      <div class="card" id="card-amortizacion" style="display:none">
        <h3 class="card-title">Tabla de Amortización</h3>
        <div class="table-scroll">
          <table class="amort-table" id="tabla-amortizacion">
            <thead id="tabla-head"></thead>
            <tbody id="tabla-body"></tbody>
            <tfoot id="tabla-foot"></tfoot>
          </table>
        </div>
      </div>

      <!-- ACCIONES -->
      <div class="actions-bar" id="actions-bar" style="display:none">
        <button class="btn-primary" id="btn-guardar">💾 Guardar Simulación</button>
        <button class="btn-secondary" id="btn-pdf">📄 Descargar PDF</button>
        <button class="btn-ghost" id="btn-nueva">+ Nueva Simulación</button>
      </div>

    </div><!-- /screen-body -->
  </div><!-- /screen-simulator -->

  <!-- ===== PANTALLA: HISTORIAL ===== -->
  <div id="screen-history" class="screen">
    <header class="app-header">
      <button class="btn-back" id="btn-back-hist">← Regresar</button>
      <h2 class="header-title">Historial</h2>
    </header>
    <div class="screen-body">
      <div class="search-bar">
        <input type="text" id="input-search" class="field-input" placeholder="🔍 Buscar por nombre o programa..." />
      </div>
      <div id="history-list" class="history-list">
        <!-- Se genera dinámicamente -->
      </div>
    </div>
  </div>

  <!-- ===== PANTALLA: DETALLE DE SIMULACIÓN GUARDADA ===== -->
  <div id="screen-detail" class="screen">
    <header class="app-header">
      <button class="btn-back" id="btn-back-detail">← Historial</button>
      <h2 class="header-title" id="detail-title">Simulación</h2>
    </header>
    <div class="screen-body">
      <div id="detail-resumen" class="card"></div>
      <div class="card" id="detail-amort-card">
        <h3 class="card-title">Tabla de Amortización</h3>
        <div class="table-scroll">
          <table class="amort-table">
            <thead id="detail-tabla-head"></thead>
            <tbody id="detail-tabla-body"></tbody>
            <tfoot id="detail-tabla-foot"></tfoot>
          </table>
        </div>
      </div>
      <div class="actions-bar">
        <button class="btn-primary" id="btn-detail-pdf">📄 Descargar PDF</button>
        <button class="btn-secondary" id="btn-detail-duplicar">Duplicar simulación</button>
      </div>
    </div>
  </div>

  <!-- ===== TOAST / NOTIFICACIONES ===== -->
  <div id="toast" class="toast"></div>

  <!-- ===== MODAL CONFIRM ===== -->
  <div id="modal-overlay" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <p id="modal-message"></p>
      <div class="modal-actions">
        <button class="btn-primary" id="modal-confirm">Confirmar</button>
        <button class="btn-ghost" id="modal-cancel">Cancelar</button>
      </div>
    </div>
  </div>

  <!-- jsPDF desde CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

  <!-- Módulos de la app -->
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="motors.js"></script>
  <script src="pdf.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
